[package]
name = "delta-example"
version = "0.1.0"
edition = "2021"
description = "Minimal Tauri app wired to tauri-plugin-delta-updater."
publish = false

# 独立示例：自带 Tauri 依赖与 lockfile，不参与根 workspace 的统一解析。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 仓库内开发用的 path 依赖。复制到真实项目后必须改成 crates.io 版本：
#   tauri-plugin-delta-updater = "0.3"
# 发布构建不要保留 `path`，否则 CI 上没有本仓库目录时会解析失败。
tauri-plugin-delta-updater = { path = "../../../plugin" }
# 同上：真实项目用 `tauri-delta-updater = "0.3"`（仅宿主需要直接调用库时）。
tauri-delta-updater = { path = "../../.." }
# tauri::generate_context! 读取配置时需要它
serde_json = "1"
