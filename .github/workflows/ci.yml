name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # core 与 platform 的 Linux/macOS 代码路径是独立编译单元，
        # 只跑 Windows 的话，三平台上任何一处编译失败都要等用户才发现。
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    # clippy 是文档承诺的"零告警"，必须在 CI 里真的执行
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

    - name: Run cargo check
      run: cargo check --all-targets --all-features --locked

    # 纯库构建：默认 feature 为空，验证关闭 generator 后仍然可用
    - name: Check library-only build
      run: cargo check --no-default-features --locked

    - name: Run cargo test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cargo test --all-targets --all-features --locked --no-fail-fast 2>&1 | Tee-Object -FilePath test.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run cargo test (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -o pipefail
        cargo test --all-targets --all-features --locked --no-fail-fast 2>&1 | tee test.log

    # 失败摘要写进 annotation：公开仓库的 Actions 原始日志需要管理员权限下载，
    # annotation 能在页面上直接看到哪个测试失败、为什么失败。
    - name: Surface test failures
      if: failure()
      shell: bash
      run: |
        # 并行测试的 panic 输出会交错，按 libtest 的失败详情块整段取，归属才可靠。
        awk '/^---- [^ ]+ stdout ----/ { show = 1 }
             show { print }
             /^note: run with / { show = 0; print "" }' test.log \
          | head -n 60 | sed 's/^/::error::/' || true

  # doctest 单独一个 job + 独立 target 目录：避免与测试/构建产物混用后
  # 出现 "found staticlib instead of rlib" 这类元数据冲突，也让通过状态独立可见。
  doctest:
    name: Doctests (isolated target)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target-doctest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        # doctest 使用独立 target 目录，缓存键要与之匹配
        workspaces: ". -> target-doctest"

    - name: Run doctests
      run: |
        set -o pipefail
        cargo test --doc --all-features --locked 2>&1 | tee doctest.log

    - name: Upload doctest log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: doctest-log
        path: doctest.log

  # 与 Windows 的 12 项真实 PowerShell 执行测试对称：
  # macOS/Linux 也必须在真实文件系统上执行替换脚本，而不只是字符串断言。
  real-fs-smoke:
    name: Real filesystem swap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run Unix replacement script tests
      shell: bash
      run: |
        set -o pipefail
        cargo test --all-features --locked --test unix_script --test macos_bundle 2>&1 | tee test.log

    - name: Surface test failures
      if: failure()
      shell: bash
      run: |
        # 并行测试的 panic 输出会交错，按 libtest 的失败详情块整段取，归属才可靠。
        awk '/^---- [^ ]+ stdout ----/ { show = 1 }
             show { print }
             /^note: run with / { show = 0; print "" }' test.log \
          | head -n 60 | sed 's/^/::error::/' || true

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Cargo.toml 声明的 rust-version 必须真的能编译，否则是虚假的兼容承诺
    - name: Setup Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Check on minimum supported Rust
      run: cargo check --all-features --locked

  # 核心 crate 与插件 crate 必须同版本发布，否则 `cargo delta init` 写出的依赖会指向
  # 一个不存在的插件版本。这里在 CI 阶段就把漂移暴露出来。
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Compare crate versions
      run: |
        CORE=$(cargo metadata --no-deps --format-version 1 \
          | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='tauri-delta-updater'))")
        PLUGIN=$(cargo metadata --no-deps --format-version 1 \
          | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='tauri-plugin-delta-updater'))")
        if [ "$CORE" != "$PLUGIN" ]; then
          echo "::error::核心 crate ($CORE) 与插件 crate ($PLUGIN) 版本不一致"
          exit 1
        fi
        JS=$(python3 -c "import json; print(json.load(open('plugin/package.json'))['version'])")
        if [ "$CORE" != "$JS" ]; then
          echo "::error::核心 crate ($CORE) 与前端包 ($JS) 版本不一致"
          exit 1
        fi
        # CHANGELOG 顶部条目必须与 Cargo.toml 一致，避免发布说明与实际版本漂移
        LOG=$(grep -m1 '^## \[' CHANGELOG.md | cut -d'[' -f2 | cut -d']' -f1)
        if [ "$CORE" != "$LOG" ]; then
          echo "::error::Cargo.toml ($CORE) 与 CHANGELOG 顶部版本 ($LOG) 不一致"
          exit 1
        fi
        echo "版本一致: $CORE"

  plugin:
    name: Plugin crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 的 tauri 编译路径与 Linux/Windows 不同，不能只靠 core 的 job 覆盖。
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # 插件依赖 tauri（Linux 上会编译 gtk/webkit 绑定），runner 默认没有这些开发头文件。
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Check formatting
      run: cargo fmt --manifest-path plugin/Cargo.toml -- --check

    - name: Clippy (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        # 去掉 ANSI 颜色，失败摘要才能按 ^error 匹配到 lint 行
        CARGO_TERM_COLOR: never
      run: |
        set -o pipefail
        cargo clippy --manifest-path plugin/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy.log

    - name: Clippy (Windows)
      if: runner.os == 'Windows'
      run: cargo clippy --manifest-path plugin/Cargo.toml --all-targets -- -D warnings

    - name: Surface clippy errors
      if: failure()
      shell: bash
      run: grep -A 5 -E "^error" clippy.log 2>/dev/null | head -n 30 | sed 's/^/::error::/' || true

    - name: Run cargo test
      run: cargo test --manifest-path plugin/Cargo.toml

    # 示例应用同时验证"插件 + 主库"的真实编译组合，避免插件改动后示例悄悄腐烂。
    # 只在 Windows 上检查：Linux 的 Tauri 构建需要额外的 webkit2gtk 系统依赖。
    - name: Check example app
      if: runner.os == 'Windows'
      run: cargo check --manifest-path examples/tauri-app/src-tauri/Cargo.toml

  # 前端类型包与 Rust 契约必须同步：TS 源码在 plugin/guest-js，
  # 构建产物 dist-js 入库，CI 验证它可以重新生成（防止手改产物）。
  guest-js:
    name: Guest JS types
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: plugin/package-lock.json

    - name: Install
      working-directory: plugin
      run: npm ci --no-audit --no-fund

    - name: Type-check and build
      working-directory: plugin
      run: npm run build

    - name: Ensure dist-js matches sources
      run: git diff --exit-code -- plugin/dist-js

  release-build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # debug 构建通过不代表 release 优化/链接路径通过。
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # 发布模式下才走的那条代码路径（例如条件编译的生成器）必须在 CI 里也编译一次，
    # 否则只有真正发布时才会暴露编译错误。
    - name: Build release
      run: cargo build --release --all-targets --all-features --locked
