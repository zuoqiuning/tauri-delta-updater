name: Security audit

# 每周扫描 Cargo.lock 的 RustSec advisory，并在发现问题时创建 issue。
# 不阻塞 PR：漏洞修复通常需要升级依赖，应单独安排而不是卡住日常改动。
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
