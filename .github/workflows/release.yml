name: Release (manual)

# 发布策略（维护者本地文档约束）：
# - 禁止 tag push 自动发布
# - 只允许人工 workflow_dispatch，且 crates.io 发布需 environment 审批
on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号（必须与 Cargo.toml 一致，不带 v）"
        required: true
        type: string
      publish:
        description: "确认发布到 crates.io（需 environment 审批）"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 发布走的是本工作流而不是 ci.yml，四处版本一致性必须在这里也校验一遍，
      # 否则 package.json / CHANGELOG 的漂移只会在发布当天暴露。
      - name: Verify versions are consistent
        run: |
          CORE=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='tauri-delta-updater'))")
          PLUGIN=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='tauri-plugin-delta-updater'))")
          NPM=$(node -p "require('./plugin/package.json').version")
          LOG=$(grep -m1 '^## \[' CHANGELOG.md | cut -d'[' -f2 | cut -d']' -f1)
          fail() { echo "::error::$1"; exit 1; }
          [ "${{ inputs.version }}" = "$CORE" ] || fail "输入版本 (${{ inputs.version }}) 与 Cargo.toml ($CORE) 不一致"
          [ "$PLUGIN" = "$CORE" ] || fail "核心 crate ($CORE) 与插件 crate ($PLUGIN) 版本不一致"
          [ "$NPM" = "$CORE" ] || fail "核心 crate ($CORE) 与 npm 包 ($NPM) 版本不一致"
          [ "$LOG" = "$CORE" ] || fail "Cargo.toml ($CORE) 与 CHANGELOG 顶部版本 ($LOG) 不一致"
          echo "版本一致: $CORE"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked --no-fail-fast

      - name: Doc tests
        env:
          # 与测试产物隔离，避免元数据混用（同 ci.yml 的独立 doctest job）
          CARGO_TARGET_DIR: target-doctest
        run: cargo test --doc --all-features --locked

      - name: Library-only build
        run: cargo check --no-default-features --locked

      - name: Tracing feature build
        run: cargo check --features tracing --locked

      - name: Package dry-run
        run: cargo publish --dry-run --locked

      # 插件的 publish --dry-run 依赖 crates.io 上已存在的核心版本，
      # 核心发布前必然失败；这里只校验打包内容，真正的插件校验放在 publish job
      # 的核心可见轮询之后。
      - name: Package contents
        run: |
          cargo package --list --allow-dirty > /tmp/core-files
          cargo package --list --manifest-path plugin/Cargo.toml --allow-dirty > /tmp/plugin-files
          if grep -E '(^|/)target/|\.env$|node_modules/' /tmp/core-files /tmp/plugin-files; then
            echo "包内出现不应发布的文件"
            exit 1
          fi
          if grep -qE 'dist-js|guest-js' /tmp/plugin-files; then
            echo "前端类型包应由 npm 发布，不应进入插件 crate tarball"
            exit 1
          fi

  publish:
    name: Publish to crates.io
    needs: verify
    if: ${{ inputs.publish }}
    # 需要在 GitHub 仓库设置中为 release environment 配置审批人；
    # 未配置时该 job 会直接运行，因此不要把 publish 默认设为 true。
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish core
        id: publish-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "未配置 CARGO_REGISTRY_TOKEN，拒绝发布"
            exit 1
          fi
          cargo publish --locked

      # 插件依赖核心 crate 的已发布版本：先发核心，等索引可见后再发插件。
      # 版本号必须提升到尚未发布的新版本：crates.io 上已存在的版本无法覆盖，
      # 而插件校验时会解析注册表里的核心 crate（不是本地 path），
      # 旧核心缺少新 API 时校验会直接失败。
      - name: Publish plugin
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='tauri-delta-updater'))")
          # 固定 sleep 在索引慢时会直接失败；轮询最多约 5 分钟。
          visible=false
          for i in $(seq 1 15); do
            if curl -sf -H "User-Agent: tauri-delta-updater-release-ci" \
              "https://crates.io/api/v1/crates/tauri-delta-updater/$VERSION" > /dev/null; then
              visible=true
              echo "crates.io 已可见 $VERSION"
              break
            fi
            sleep 20
          done
          if [ "$visible" != true ]; then
            echo "核心 $VERSION 在 crates.io 仍不可见；插件未发布，可稍后单独重跑本 job"
            exit 1
          fi
          # 核心已发布且不可回滚：先 dry-run 确认插件能按注册表版本构建，再真正发布。
          cargo publish --manifest-path plugin/Cargo.toml --dry-run --locked
          cargo publish --manifest-path plugin/Cargo.toml --locked

      # 核心一旦发布就不可回滚：明确告诉值班人现在处于“核心已发布、插件未发布”，
      # 而不是一个需要翻日志才能判断的红叉。
      - name: Surface partial publish
        if: failure() && steps.publish-core.outcome == 'success'
        run: echo "::error::核心已发布、插件未发布。确认 crates.io 上核心版本可见后，单独重跑本 job（cargo publish --manifest-path plugin/Cargo.toml --locked）；核心不因插件失败而 yank。"

  # 前端类型包：与 crate 同版本。未配置 NPM_TOKEN 时跳过，避免首次发版被卡住。
  publish-npm:
    name: Publish npm package
    needs: publish
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "未配置 NPM_TOKEN，跳过 npm 发布"
            exit 0
          fi
          npm publish --access public
