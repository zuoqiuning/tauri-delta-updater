# 全量回退权限集：可以下载并执行平台安装器，权限最高。
[[set]]
identifier = "full"
description = """
Full-installer fallback: download and execute the platform installer. This is
the highest-privilege set; grant it only to windows that really need it.
"""
permissions = [
    "allow-download-full",
    "allow-install-full",
]
