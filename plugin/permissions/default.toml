[default]
description = """
默认权限：检查、增量安装、诊断、取消、退出安全模式与跨重启安装。
不包含全量安装器（download_full / install_full）：需要全量回退时额外授予
`delta-updater:full`。命令名与 `src/lib.rs` 中的 `generate_handler!` 列表一致。
"""
permissions = [
    "allow-check",
    "allow-install",
    "allow-prepare",
    "allow-launch",
    "allow-diagnose",
    "allow-config-warnings",
    "allow-cancel",
    "allow-reset-safety",
    "allow-pending",
    "allow-discard-pending",
    "allow-install-pending",
]
