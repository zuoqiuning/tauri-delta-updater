[package]
name = "tauri-plugin-delta-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tauri v2 plugin for tauri-delta-updater: delta updates, full-installer fallback, events and permissions."
license.workspace = true
authors.workspace = true
repository.workspace = true
links = "tauri-plugin-delta-updater"
# 前端类型包只随 npm 发布，不塞进 crate tarball。
exclude = ["guest-js", "dist-js", "node_modules", "package.json", "package-lock.json", "tsconfig.json"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
# 插件是可选外壳：不启用插件的宿主不会引入 tauri，主库本身保持框架无关。
# 插件只需要 core API（命令、事件、Channel），不拉 wry/webview 依赖；
# 宿主自己的 tauri 依赖会把需要的 feature 补齐。
tauri = { version = "2", default-features = false, features = [] }
tauri-delta-updater = { version = "0.3.0", path = ".." }
# 仅用于 plugins.delta-updater.proxy：与核心库共用同一版本区间，避免双版本共存。
reqwest = { version = ">=0.13, <0.14", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# mock runtime：不需要窗口/WebView 也能验证插件的注册与状态。
# 保持 default-features = false，测试二进制就不会依赖 WebView2Loader.dll。
tauri = { version = "2", default-features = false, features = ["test"] }
tempfile = "3"
